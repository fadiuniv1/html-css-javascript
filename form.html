<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply for a Course</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="form-page">

<header>
    <h1>Apply to Buy a Course</h1>
    <p>Fill in your details and we’ll contact you soon.</p>

    <nav>
        <a href="index.html">Courses</a>
        <a href="gallery.html">Media</a>
        <a href="form.html">Apply</a>
        <button id="darkToggle">Dark Mode</button>
    </nav>
</header>

<main>

    <form id="projectForm">
        <label for="userName">Full Name:</label>
        <input type="text" id="userName" required>

        <label for="userEmail">Email Address:</label>
        <input type="email" id="userEmail" required>

        <label for="userDate">Date of Birth:</label>
        <input type="date" id="userDate">

        <label for="userExperience">Years of Experience (1-10):</label>
        <input type="number" id="userExperience" min="1" max="10">

        <label for="userUpdates">Subscribe to updates?</label>
        <input type="checkbox" id="userUpdates">

        <button type="submit" id="submitBtn">Submit Application</button>
    </form>

    <div id="displayArea">
        <h3>Your Submission:</h3>
        <div id="formDataOutput">
            <p>No data submitted yet.</p>
        </div>
    </div>

</main>

<footer>
    <p>LearnHub - Fadi Abu Saleh — 2026</p>
</footer>

<script src="script.js"></script>
</body>
</html>
