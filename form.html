<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<!-- added class for layout fixes in css -->
<body class="form-page">

<!-- header with page title + nav -->
<header>
    <h1>Submit Your Details</h1>

    <!-- navigation for switching pages -->
    <nav>
        <a href="index.html">Home</a>
        <a href="gallery.html">Gallery</a>
        <a href="form.html">Contact</a>
        <button id="darkToggle">Dark Mode</button>
    </nav>
</header>

<!-- main area that holds the form + output -->
<main>

    <!-- form for collecting user data -->
    <form id="projectForm">

        <!-- text input -->
        <label for="userName">Full Name:</label>
        <input type="text" id="userName" required>

        <!-- email input -->
        <label for="userEmail">Email Address:</label>
        <input type="email" id="userEmail" required>

        <!-- date input -->
        <label for="userDate">Date of Birth:</label>
        <input type="date" id="userDate">

        <!-- number input -->
        <label for="userExperience">Years of Experience (1-10):</label>
        <input type="number" id="userExperience" min="1" max="10">

        <!-- checkbox input -->
        <label for="userUpdates">Subscribe to updates?</label>
        <input type="checkbox" id="userUpdates">

        <!-- submit button -->
        <button type="submit" id="submitBtn">Submit Data</button>
    </form>

    <!-- area where submitted data will show -->
    <div id="displayArea">
        <h3>Submitted Information:</h3>
        <div id="formDataOutput">
            <p>No data submitted yet.</p>
        </div>
    </div>

</main>

<!-- footer for credits -->
<footer>
    <p>Created by Fadi — 2025</p>
</footer>

<script src="script.js"></script>

</body>
</html>
