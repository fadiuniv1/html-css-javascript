<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Form</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
   <header><h1>Submit Your Details</h1></header>
<nav>
    <a href="index.html">Home</a>
    <a href="gallery.html">Gallery</a>
    <a href="form.html">Contact</a>
    <button id="darkToggle">Dark Mode</button>
</nav>
    <main>
     
        <form id="projectForm">
            <label for="userName">Full Name:</label>
            <input type="text" id="userName" required>

            <label for="userEmail">Email Address:</label>
            <input type="email" id="userEmail" required>

            <label for="userDate">Date of Birth:</label>
            <input type="date" id="userDate">

            <label for="userExperience">Years of Experience (1-10):</label>
            <input type="number" id="userExperience" min="1" max="10">

            <label for="userUpdates">Subscribe to updates?</label>
            <input type="checkbox" id="userUpdates">

            <button type="submit" id="submitBtn">Submit Data</button>
        </form>

        <hr>

        <div id="displayArea">
            <h3>Submitted Information:</h3>
            <div id="formDataOutput">
                <p>No data submitted yet.</p>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
